<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <defs>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="8"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.18"/>
      </feComponentTransfer>
    </filter>
    <clipPath id="circle">
      <circle cx="720" cy="460" r="238"/>
    </clipPath>
    <linearGradient id="vignette" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b1714"/>
      <stop offset="0.54" stop-color="#2c2721"/>
      <stop offset="1" stop-color="#0e0d0b"/>
    </linearGradient>
    <radialGradient id="wash" cx="50%" cy="45%" r="62%">
      <stop offset="0" stop-color="#d9c59e" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#9cafaa" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1a1714" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="1024" fill="url(#vignette)"/>
  <rect width="1440" height="1024" fill="url(#wash)"/>
  <rect width="1440" height="1024" filter="url(#paper)" opacity="0.75"/>

  <g opacity="0.2" stroke="#fff4df" stroke-width="1">
    <circle cx="720" cy="460" r="310" fill="none"/>
    <circle cx="720" cy="460" r="238" fill="none"/>
    <line x1="720" x2="720" y1="130" y2="790"/>
    <line x1="390" x2="1050" y1="460" y2="460"/>
  </g>

  <image href="../assets/photos/ferris-wheel.jpg" x="482" y="222" width="476" height="476" preserveAspectRatio="xMidYMid slice" clip-path="url(#circle)" opacity="0.9"/>
  <circle cx="720" cy="460" r="238" fill="none" stroke="#f6ead4" stroke-width="14" opacity="0.86"/>
  <circle cx="720" cy="460" r="280" fill="none" stroke="#b65e4d" stroke-width="2" stroke-dasharray="14 20" opacity="0.72"/>

  <text x="90" y="92" fill="#f8efd9" font-family="Inter, Arial, sans-serif" font-size="15" letter-spacing="7">ALEX PORTFOLIO</text>
  <text x="90" y="792" fill="#f8efd9" font-family="Georgia, serif" font-size="86">Enter through exposure.</text>
  <text x="93" y="846" fill="#c9bca5" font-family="Inter, Arial, sans-serif" font-size="21">首页从一片暗房开始，鼠标靠近时光圈打开，照片逐渐显影。</text>

  <g transform="translate(1030 770)">
    <rect x="0" y="0" width="300" height="66" rx="33" fill="none" stroke="#f6ead4" opacity="0.86"/>
    <text x="31" y="42" fill="#f6ead4" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="2">HOLD TO DEVELOP</text>
    <circle cx="258" cy="33" r="19" fill="#b65e4d"/>
  </g>

  <g transform="translate(88 178)" opacity="0.9">
    <rect width="230" height="310" fill="#f8efd9" opacity="0.08" stroke="#f8efd9"/>
    <text x="24" y="52" fill="#f8efd9" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="3">TRANSITION IDEA</text>
    <text x="24" y="104" fill="#c9bca5" font-family="Georgia, serif" font-size="26">Darkroom</text>
    <text x="24" y="146" fill="#c9bca5" font-family="Georgia, serif" font-size="26">to homepage</text>
    <text x="24" y="224" fill="#c9bca5" font-family="Inter, Arial, sans-serif" font-size="14">scroll = image develops</text>
    <text x="24" y="252" fill="#c9bca5" font-family="Inter, Arial, sans-serif" font-size="14">cursor = small red safe light</text>
  </g>
</svg>
